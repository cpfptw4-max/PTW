<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permit Closure</title>
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#14213D; --amber:#F2A900; --paper:#F4F6F9; --card:#FFFFFF;
  --line:#D8DEE8; --muted:#5B677D; --ok:#1F7A4D; --bad:#B3261E; --onamber:#14213D;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#E8ECF4;--paper:#0F1626;--card:#18223A;--line:#2C3A58;--muted:#9AA6BD;--ok:#4CC38A;--bad:#F2786E;color-scheme:dark}
}
:root[data-theme="dark"]{--ink:#E8ECF4;--paper:#0F1626;--card:#18223A;--line:#2C3A58;--muted:#9AA6BD;--ok:#4CC38A;--bad:#F2786E;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{background:var(--amber);color:var(--onamber);margin:0 -16px 20px;padding:22px 20px 18px;
  background-image:repeating-linear-gradient(135deg,transparent 0 14px,rgba(20,33,61,.07) 14px 28px)}
header h1{font:700 2rem/1 "Barlow Condensed",sans-serif;margin:0;letter-spacing:.01em}
header p{margin:6px 0 0;font-weight:500}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font:600 1.25rem/1.2 "Barlow Condensed",sans-serif;margin:0 0 12px}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
input:focus{outline:3px solid var(--amber);outline-offset:1px;border-color:var(--ink)}
.permit-input{font:700 1.6rem "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;gap:10px;margin-top:12px}
.row input{flex:1}
button{font:600 1rem "Barlow",sans-serif;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn-close{background:var(--ink);color:var(--paper);white-space:nowrap}
.btn-send{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(528px,calc(100% - 32px));background:#1FA855;color:#fff;font-size:1.1rem;padding:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-send:disabled{background:#8A94A6;box-shadow:none;cursor:not-allowed}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin-top:6px}
ul{list-style:none;margin:0;padding:0}
.tag{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;margin-bottom:8px}
.tag b{font:700 1.35rem "Barlow Condensed",sans-serif;letter-spacing:.05em}
.tag small{color:var(--muted);display:block}
.x{background:transparent;color:var(--bad);padding:6px 10px;font-size:1.3rem;line-height:1}
.empty{color:var(--muted);margin:0}
.day{margin-top:14px}
.day h3{font:600 1rem "Barlow",sans-serif;margin:0 0 6px;padding-bottom:4px;border-bottom:2px solid var(--amber);display:flex;justify-content:space-between}
.day h3 span{color:var(--muted);font-weight:500}
.hist{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line)}
.hist b{font:700 1.1rem "Barlow Condensed",sans-serif;letter-spacing:.05em}
.hist span{color:var(--muted);font-size:.9rem}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
.toast.on{opacity:1}
.linkbtn{background:transparent;color:var(--muted);padding:4px 0;font-weight:500;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Permit Closure</h1>
    <p>Close permits, then send the report on WhatsApp</p>
  </header>

  <section>
    <h2>Your details</h2>
    <label for="name">Full name</label>
    <input id="name" autocomplete="name" placeholder="e.g. Ahmed Ali">
    <label for="company">Company</label>
    <input id="company" autocomplete="organization" placeholder="e.g. Kuwait Energy">
  </section>

  <section>
    <h2>Close a permit</h2>
    <label for="permit">Permit number</label>
    <div class="row">
      <input id="permit" class="permit-input" placeholder="S-1234" autocapitalize="characters" autocomplete="off" enterkeyhint="done">
      <button class="btn-close" id="closeBtn">Close</button>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section>
    <h2 id="pendTitle">Ready to send (0)</h2>
    <ul id="pending"></ul>
  </section>

  <section>
    <h2>Closed permits by date</h2>
    <div id="history"></div>
  </section>
</div>

<button class="btn-send" id="sendBtn" disabled>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>
  <span id="sendLabel">Upload &amp; send on WhatsApp</span>
</button>
<div class="toast" id="toast" role="status"></div>

<script>
const WA_NUMBER = "9647748193551";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let pending = store.get("pc_pending", []);
let history = store.get("pc_history", []);

$("name").value = store.get("pc_name", "");
$("company").value = store.get("pc_company", "");
$("name").addEventListener("input", e => store.set("pc_name", e.target.value.trim()));
$("company").addEventListener("input", e => store.set("pc_company", e.target.value.trim()));

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }
const fmtDate = d => new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const fmtTime = d => new Date(d).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const dayKey = d => { const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };

function normalize(v){
  v = v.toUpperCase().replace(/\s+/g,"");
  const m = v.match(/^([A-Z]{1,3})-?(\d+)$/);
  return m ? m[1]+"-"+m[2] : null;
}

function addPermit(){
  const raw = $("permit").value; const err = $("err");
  const num = normalize(raw);
  if(!raw.trim()){ err.textContent="Enter a permit number."; return; }
  if(!num){ err.textContent="Use the format letter-number, e.g. S-1234."; return; }
  if(pending.some(p=>p.no===num)){ err.textContent=num+" is already in the list."; return; }
  err.textContent="";
  pending.unshift({no:num, at:Date.now()});
  store.set("pc_pending", pending);
  $("permit").value=""; $("permit").focus();
  render(); toast(num+" closed");
}

function removePermit(i){ pending.splice(i,1); store.set("pc_pending",pending); render(); }

function render(){
  $("pendTitle").textContent = "Ready to send ("+pending.length+")";
  $("pending").innerHTML = pending.length ? pending.map((p,i)=>
    `<li class="tag"><div><b>${p.no}</b><small>Closed ${fmtDate(p.at)}, ${fmtTime(p.at)}</small></div>
     <button class="x" aria-label="Remove ${p.no}" onclick="removePermit(${i})">×</button></li>`).join("")
    : `<p class="empty">No permits yet. Closed permits appear here.</p>`;
  $("sendBtn").disabled = !pending.length;
  $("sendLabel").textContent = pending.length ? `Upload & send on WhatsApp (${pending.length})` : "Upload & send on WhatsApp";

  if(!history.length){ $("history").innerHTML = `<p class="empty">Sent permits are listed here by date.</p>`; return; }
  const groups = {};
  history.forEach(h=>{ (groups[dayKey(h.at)] ||= []).push(h); });
  $("history").innerHTML = Object.keys(groups).sort().reverse().map(k=>{
    const items = groups[k].sort((a,b)=>b.at-a.at);
    return `<div class="day"><h3>${fmtDate(items[0].at)}<span>${items.length} permit${items.length>1?"s":""}</span></h3>`+
      items.map(h=>`<div class="hist"><b>${h.no}</b><span>${fmtTime(h.at)} · ${h.by||""}</span></div>`).join("")+`</div>`;
  }).join("") + `<button class="linkbtn" onclick="clearHistory()">Clear history</button>`;
}

function clearHistory(){ if(confirm("Clear all sent permits from this device?")){ history=[]; store.set("pc_history",history); render(); } }

function buildPDF(name, company, items){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const W = doc.internal.pageSize.getWidth();
  const now = new Date();
  const ref = "PCR-"+dayKey(now).replace(/-/g,"")+"-"+String(now.getHours()).padStart(2,"0")+String(now.getMinutes()).padStart(2,"0");

  doc.setFillColor(20,33,61); doc.rect(0,0,W,34,"F");
  doc.setFillColor(242,169,0); doc.rect(0,34,W,3,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(20);
  doc.text(company.toUpperCase(), 15, 16);
  doc.setFont("helvetica","normal"); doc.setFontSize(11);
  doc.text("Permit to Work — Closure Report", 15, 25);
  doc.setFontSize(9);
  doc.text("Ref: "+ref, W-15, 16, {align:"right"});
  doc.text(fmtDate(now)+"  "+fmtTime(now), W-15, 25, {align:"right"});

  doc.setTextColor(20,33,61);
  doc.setFillColor(244,246,249); doc.roundedRect(15,46,W-30,26,2,2,"F");
  doc.setFontSize(9); doc.setTextColor(91,103,125);
  doc.text("CLOSED BY",21,54); doc.text("COMPANY",W/2+3,54);
  doc.text("TOTAL PERMITS CLOSED",21,65);
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(20,33,61);
  doc.text(name,21,60); doc.text(company,W/2+3,60);
  doc.text(String(items.length),68,65);

  const sorted = [...items].sort((a,b)=>a.at-b.at);
  doc.autoTable({
    startY:80,
    head:[["#","Permit No.","Closure Date","Closure Time","Status"]],
    body:sorted.map((p,i)=>[i+1,p.no,fmtDate(p.at),fmtTime(p.at),"CLOSED"]),
    theme:"grid",
    margin:{left:15,right:15},
    styles:{font:"helvetica",fontSize:10,cellPadding:3.2,lineColor:[216,222,232],textColor:[20,33,61]},
    headStyles:{fillColor:[20,33,61],textColor:255,fontStyle:"bold"},
    alternateRowStyles:{fillColor:[247,248,250]},
    columnStyles:{0:{halign:"center",cellWidth:12},1:{fontStyle:"bold"},4:{halign:"center",textColor:[31,122,77],fontStyle:"bold"}}
  });

  let y = doc.lastAutoTable.finalY + 18;
  if(y > 250){ doc.addPage(); y = 30; }
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(20,33,61);
  doc.text("I confirm that the permits listed above have been closed and the work areas left safe.",15,y,{maxWidth:W-30});
  y += 20;
  doc.setDrawColor(20,33,61); doc.line(15,y,85,y); doc.line(W-85,y,W-15,y);
  doc.setFontSize(9); doc.setTextColor(91,103,125);
  doc.text("Name: "+name,15,y+5); doc.text("Signature",W-85,y+5);

  const pages = doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    const H = doc.internal.pageSize.getHeight();
    doc.setDrawColor(242,169,0); doc.setLineWidth(.8); doc.line(15,H-15,W-15,H-15);
    doc.setFontSize(8); doc.setTextColor(91,103,125);
    doc.text(company+"  |  "+ref, 15, H-10);
    doc.text("Page "+i+" of "+pages, W-15, H-10, {align:"right"});
  }
  return {doc, ref};
}

// Fallback for devices that cannot share files: save PDF + open the WhatsApp chat
let dl = null;
if(window.claude && window.claude.use){ window.claude.use("downloads").then(d=>{ dl = d; }).catch(()=>{}); }

function fallbackSend(blob, fileName, msg){
  const waUrl = "https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(msg+"\n\n(PDF report attached)");
  const w = document.createElement("a");
  w.href = waUrl; w.target = "_blank"; w.rel = "noopener";
  document.body.appendChild(w); w.click(); w.remove();

  if(dl){
    dl.save({filename:fileName, data:blob})
      .then(()=>toast("PDF saved. Attach it in the WhatsApp chat."))
      .catch(()=>toast("PDF was not saved."));
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    toast("PDF saved. Attach it in the WhatsApp chat.");
  }
}

async function send(){
  const name = $("name").value.trim(), company = $("company").value.trim();
  if(!name || !company){ toast("Enter your name and company first"); (name?$("company"):$("name")).focus(); return; }
  if(!pending.length) return;
  if(!window.jspdf){ toast("PDF tool did not load. Check your internet and reload."); return; }

  const items = [...pending];
  const {doc, ref} = buildPDF(name, company, items);
  const safe = s => s.replace(/[^\w\-]+/g,"_");
  const fileName = `Permit_Closure_${safe(company)}_${safe(name)}_${dayKey(new Date())}.pdf`;
  const blob = doc.output("blob");
  const msg = `Permit Closure Report\nCompany: ${company}\nClosed by: ${name}\nPermits (${items.length}): ${items.map(p=>p.no).join(", ")}\nRef: ${ref}`;

  const file = new File([blob], fileName, {type:"application/pdf"});

  // Preferred: share sheet with the PDF actually attached (choose WhatsApp → chat)
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], text:msg});
      toast("Report shared");
    }catch(e){
      if(e.name==="AbortError"){ toast("Sending cancelled. Permits are still in the list."); return; }
      fallbackSend(blob, fileName, msg);
    }
  } else {
    fallbackSend(blob, fileName, msg);
  }

  history = items.map(p=>({...p, by:name, ref})).concat(history);
  pending = [];
  store.set("pc_history", history); store.set("pc_pending", pending);
  render();
}

$("closeBtn").addEventListener("click", addPermit);
$("permit").addEventListener("keydown", e=>{ if(e.key==="Enter") addPermit(); });
$("sendBtn").addEventListener("click", send);
render();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
